name: CI

on:
  push:
    branches: [main]
    # Corrigir uma vírgula no site não precisa de matriz em dois sistemas
    # operacionais, PostgreSQL e imagem Docker. O gatilho de pull_request
    # continua sem filtro de propósito: se um dia a CI virar verificação
    # obrigatória, um filtro ali faria o PR esperar para sempre por um
    # job que nunca roda.
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/pages.yml'
      - '**.md'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      # O detector de corrida é obrigatório: o scheduler, o pool de workers
      # e o batch writer são concorrentes, e uma corrida ali só apareceria
      # em produção.
      - name: Test with race detector
        run: go test ./... -race -count=1 -coverprofile=coverage.out -covermode=atomic

      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: go tool cover -func=coverage.out | tail -n 1

  postgres:
    name: Conformidade contra PostgreSQL
    runs-on: ubuntu-latest
    # É o que impede "banco plugável" de virar fachada: a mesma bateria
    # que o SQLite passa, contra um servidor de verdade. Sem isto, o
    # caminho de produção seria exercitado só em produção.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: upwatch
          POSTGRES_PASSWORD: upwatch
          POSTGRES_DB: upwatch
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U upwatch"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Suíte de conformidade
        env:
          UPWATCH_TEST_POSTGRES_DSN: postgres://upwatch:upwatch@127.0.0.1:5432/upwatch?sslmode=disable
        run: go test ./internal/store/... -race -count=1

  protocols:
    name: Checkers de protocolo contra serviço real
    runs-on: ubuntu-latest
    # O servidor falso dos testes cobre o protocolo; só um serviço real
    # mostra o que a ACL do Redis recusa ou o que a transação somente
    # leitura impede de fato.
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: upwatch
          POSTGRES_PASSWORD: upwatch
          POSTGRES_DB: upwatch
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U upwatch"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: upwatch
          MYSQL_PASSWORD: upwatch
          MYSQL_DATABASE: upwatch
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Testes contra Redis, PostgreSQL e MySQL
        env:
          UPWATCH_TEST_REDIS_ADDR: 127.0.0.1:6379
          UPWATCH_TEST_POSTGRES_DSN: postgres://upwatch:upwatch@127.0.0.1:5432/upwatch?sslmode=disable
          # root, e não o usuário de aplicação: o teste de INTO OUTFILE só
          # mostra a regra do checker com um usuário que tem FILE.
          UPWATCH_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/upwatch
        run: go test ./internal/checker/... -race -count=1 -run 'Live'

  web:
    name: Interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Instalar
        run: cd web && pnpm install --frozen-lockfile

      - name: Tipos
        run: cd web && pnpm exec tsc -b

      - name: Testes
        run: cd web && pnpm vitest run

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Arquivos fora do formato padrão:"
            echo "$unformatted"
            exit 1
          fi

      # Versão fixa, não "latest": um lançamento novo do linter pode
      # deixar a build vermelha num projeto que não mudou uma linha, e
      # isso ensina a ignorar a build vermelha.
      #
      # A action precisa ser v7 ou mais nova para aceitar o golangci-lint
      # v2 — a v6 só conhece a linha v1 e recusa a versão antes de rodar
      # qualquer linter. São duas numerações independentes, e é fácil
      # fixar uma e esquecer a outra.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0

  build:
    name: Build static binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      # A interface entra no binário por go:embed. Compilar sem
      # construí-la produz um executável que serve a página de "interface
      # não construída" — e nada indica que foi isso que aconteceu.
      - name: Construir a interface
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm vite build

      # CGO desligado: o driver SQLite é pure Go, então o binário final é
      # estático e a imagem Docker fica mínima.
      - name: Build
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags='-s -w' -o upwatch ./cmd/upwatch

  image:
    name: Imagem Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Construir sem publicar: um Dockerfile que só é exercitado no dia
      # do release quebra no dia do release.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: upwatch:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A imagem precisa subir sem privilégio e responder: um build que
      # passa mas não executa não prova nada.
      - name: Subir e conferir
        run: |
          docker run -d --name upwatch-ci -p 8080:8080 upwatch:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/healthz
          curl -sf http://127.0.0.1:8080/metrics | head -3

          # Rodar como root numa imagem que não precisa disso é o achado
          # mais comum de qualquer varredura de contêiner.
          test "$(docker exec upwatch-ci id -u)" = "10001"
          docker rm -f upwatch-ci
