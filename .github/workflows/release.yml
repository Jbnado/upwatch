name: Release

# Duas coisas diferentes acontecem aqui, e por isso dois gatilhos.
#
# Na main, publica a imagem com a tag "main": é a versão de quem quer
# acompanhar o desenvolvimento, e existir sempre evita o buraco entre
# lançamentos.
#
# Na tag, publica também os binários e move "latest". A tag é a decisão
# de dizer "esta serve"; binário de todo push encheria a página de
# releases de coisas que ninguém pediu.
on:
  push:
    branches: [main]
    tags: ['v*']

# Cada job declara só o que precisa: o token de escrita fica restrito
# ao passo que publica, e uma action comprometida num job vizinho não
# herda permissão para adulterar release ou imagem.
permissions:
  contents: read

# Sem isto, dois pushes seguidos na main viram duas publicações
# simultâneas que empurram a mesma tag "main" — e quem termina por último
# ganha, que não é necessariamente o commit mais novo. Mergear quatro PRs
# em sequência chegou a deixar quatro publicações correndo juntas, e a
# tag poderia acabar apontando para uma imagem antiga.
#
# Na main o build mais novo cancela o anterior: a tag acompanha o
# desenvolvimento, e a imagem de um commit já superado não interessa a
# ninguém. Numa tag de versão, nunca cancela — cada tag tem grupo próprio,
# e interromper a publicação de um lançamento pela metade deixaria a
# página de releases sem os binários.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  binaries:
    name: Binários
    # Só na tag: é o que distingue publicar de acompanhar.
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      # A interface é embarcada por go:embed, então construí-la é
      # pré-requisito de compilar o servidor. Sem esta etapa o binário
      # sairia servindo a página de "interface não construída".
      - name: Construir a interface
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm vite build

      # Um binário por plataforma, todos estáticos. CGO desligado porque
      # o driver SQLite é pure Go — é o que permite copiar o arquivo para
      # qualquer máquina e simplesmente rodar.
      #
      # A sonda sai junto e com a mesma versão: ela reporta ao central
      # pelo push, e publicá-las em momentos diferentes deixaria alguém
      # com uma combinação que nunca foi testada.
      - name: Compilar
        env:
          CGO_ENABLED: '0'
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for alvo in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${alvo%/*}
            arch=${alvo#*/}
            ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi

            GOOS=$os GOARCH=$arch go build \
              -trimpath \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "dist/upwatch-probe_${os}_${arch}${ext}" ./cmd/upwatch-probe

            saida=dist/upwatch_${os}_${arch}${ext}

            GOOS=$os GOARCH=$arch go build \
              -trimpath \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "$saida" ./cmd/upwatch
          done

      # Somas de verificação: quem baixa um binário de release precisa
      # conseguir confirmar que recebeu o que foi publicado.
      - name: Somas de verificação
        run: cd dist && sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/*
          generate_release_notes: true

  image:
    name: Imagem
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          # A action põe o nome em minúsculas sozinha; o GHCR não aceita
          # maiúscula no caminho e o dono do repositório tem.
          images: ghcr.io/${{ github.repository }}
          # "main" acompanha o desenvolvimento; "latest" só se move numa
          # tag estável, porque quem fixou em latest não deveria receber
          # uma pré-versão sem pedir.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          # arm64 não é luxo: boa parte das instalações caseiras roda em
          # placa ARM, e é justamente esse público que quer um contêiner
          # só.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  probe-image:
    name: Imagem da sonda
    runs-on: ubuntu-latest
    # id-token só aqui: é o que permite assinar sem chave guardada
    # (cosign keyless), e nenhum outro job precisa dele.
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          # ghcr.io/jbnado/upwatch-probe: a action põe em minúsculas.
          images: ghcr.io/${{ github.repository }}-probe
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}

      # A sonda roda dentro de rede alheia, e quem a instala precisa poder
      # conferir o que roda: SBOM e proveniência vão junto da imagem, e a
      # assinatura abaixo prende o digest a este workflow.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.probe
          # O mesmo par de arquiteturas do servidor: há sonda em VM x86 de
          # empresa e em placa ARM dentro de casa.
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=probe
          cache-to: type=gha,mode=max,scope=probe

      # Assina o digest, não a tag: a tag se move, o digest não. O README
      # da sonda mostra o cosign verify correspondente.
      - name: Assinar
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          imagem=$(echo "$TAGS" | head -n 1 | cut -d: -f1)
          cosign sign --yes "${imagem}@${DIGEST}"
