name: Pages

# Publica o site na main. É documentação, não release: esperar uma tag
# deixaria a página descrevendo uma versão anterior à que está no
# repositório, que é o pior estado possível para quem chega pelo site.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  # Permite republicar sem precisar de um commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez, sem cancelar a que já começou: interromper no
# meio deixaria o site parcialmente atualizado.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement liga o Pages pela API na primeira execução, para o
      # site subir com o push em vez de esperar alguém achar a opção em
      # Settings. Se a organização não permitir, o passo falha aqui com
      # uma mensagem clara — e não com um site que simplesmente não
      # aparece.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # O site é HTML e CSS escritos à mão, sem etapa de build: não há
      # dependência para instalar, nada para compilar e nada que possa
      # quebrar entre uma publicação e outra.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
