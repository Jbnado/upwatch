version: 2

# Atualização automática de dependências.
#
# Semanal, e agrupada: um pull request por ecossistema por semana é
# revisável; um por dependência transforma a caixa de entrada em ruído e
# ensina a ignorar todos — inclusive o de correção de segurança.
#
# Todos miram a next: a main só recebe o que já passou pela integração.
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: next
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /web
    target-branch: next
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    target-branch: next
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    target-branch: next
    schedule:
      interval: weekly
