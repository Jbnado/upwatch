openapi: 3.1.0

info:
  title: UpWatch API
  version: 0.1.0
  description: |
    API de monitoramento do UpWatch.

    Toda funcionalidade da interface passa por aqui — não existe caminho
    privilegiado para a interface gráfica nem API paralela para automação.
    O que a tela faz, um script faz igual.

    ## Autenticação

    Duas formas, aceitas nas mesmas rotas:

    - **Cookie de sessão**, obtido em `POST /api/v1/auth/login`. É o que a
      interface usa.
    - **Token Bearer**, criado em `POST /api/v1/auth/tokens`. É o caminho
      para scripts e integrações.

    O segredo de um token aparece **apenas** na resposta que o cria. Depois
    disso só o prefixo é exposto, e nada permite reconstruí-lo.

    ## Retenção

    Batidas cruas vivem poucos dias; o histórico longo é servido por
    `/rollups`, que responde por meses sem custo proporcional. Uma janela
    de vários meses deve ser consultada em `/rollups`, não em
    `/heartbeats`.
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: /
    description: A própria instalação

tags:
  - name: setup
    description: Assistente de primeiro acesso
  - name: auth
    description: Sessões, senha e tokens
  - name: monitors
    description: Cadastro de alvos monitorados
  - name: groups
    description: |
      Grupos de monitores (Sistema → Ambiente) e o que a tela inicial lê
      deles. Toda rota autenticada respeita o escopo da conta&#58; monitor
      ou grupo fora dele responde 404, como se não existisse.
  - name: data
    description: Histórico, agregados e exportação
  - name: push
    description: Recebimento de sinal de monitores push
  - name: alerts
    description: Canais de aviso e histórico de incidentes
  - name: public
    description: |
      Página pública de estado. É a única superfície de leitura sem
      credencial, e o que sai por ela é montado num lugar só — nada aqui
      revela endereço de alvo, causa detectada ou identificador interno.
  - name: status-pages
    description: Administração das páginas públicas e dos relatos

paths:
  /healthz:
    get:
      tags: [setup]
      summary: Verificação de vida
      description: |
        Não exige autenticação: orquestradores a consultam antes de
        qualquer credencial existir.
      security: []
      responses:
        "200":
          description: O processo está no ar
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /metrics:
    get:
      tags: [setup]
      security: []
      summary: Exposição para Prometheus
      description: |
        Formato de texto do Prometheus, fora da sessão — o coletor raspa
        sem ela.

        Com `UPWATCH_METRICS_TOKEN` definido, exige
        `Authorization&#58; Bearer <token>` e responde 401 sem ele. Sem a
        variável, a exposição fica aberta, como sempre foi&#58; serve à rede
        local, mas numa instalação exposta na internet publica o nome de
        todos os monitores, e com eles a topologia interna.

        Sem token e com alguma conta de acesso restrito a grupos, responde
        403 com a orientação de definir o token&#58; a exposição aberta seria
        o atalho dessa conta para ver os nomes que o escopo esconde.

        Monitor dentro de um grupo leva também o rótulo `group` com o
        caminho ("RPA / prod")&#58; o nome só é único dentro do grupo, e sem
        o rótulo o "bff" de produção e o de homologação seriam a mesma
        série.

        O que sai são contagens, estados e nomes de monitor. O endereço do
        alvo nunca vira rótulo&#58; além de descrever a topologia interna,
        endereço em rótulo é cardinalidade alta, que é como se derruba um
        Prometheus.

        Famílias publicadas&#58; `upwatch_build_info`,
        `upwatch_monitors_total`, `upwatch_monitor_status`,
        `upwatch_monitor_enabled`, `upwatch_monitor_interval_seconds`,
        `upwatch_monitor_latency_seconds`,
        `upwatch_monitor_last_check_timestamp_seconds`,
        `upwatch_incidents_open`, `upwatch_checks_total`,
        `upwatch_notifications_total` e
        `upwatch_metrics_truncated_monitors`.

        Em `upwatch_monitor_status`, 1 é no ar, 0 fora do ar, 2 degradado
        e -1 sem medição. "Sem medição" não é zero de propósito&#58;
        confundir os dois faria o alerta disparar para todo monitor
        recém-criado.
      responses:
        "200":
          description: Métricas em texto
          content:
            text/plain:
              schema: { type: string }
        "401":
          description: Token de métricas ausente ou errado (só quando configurado)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Sem token configurado, e há conta com acesso restrito a grupos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/openapi.yaml:
    get:
      tags: [setup]
      summary: Esta especificação
      description: |
        Servida sem autenticação: descobrir como autenticar é justamente o
        que se procura aqui, e exigir credencial criaria um ciclo.

        Vem embarcada no binário, então nunca diverge da versão em
        execução.
      security: []
      responses:
        "200":
          description: A especificação OpenAPI
          content:
            application/yaml:
              schema: { type: string }

  /api/v1/setup:
    get:
      tags: [setup]
      summary: Informa se a instalação precisa da conta inicial
      security: []
      responses:
        "200":
          description: Situação do assistente
          content:
            application/json:
              schema:
                type: object
                properties:
                  needs_setup: { type: boolean }
    post:
      tags: [setup]
      summary: Cria a conta inicial
      description: |
        Só funciona enquanto não existir nenhuma conta. O assistente não é
        autenticado, e mantê-lo disponível deixaria qualquer visitante
        criar uma conta e tomar a instalação.

        Exige o token de configuração em `setup_token`, para a instância
        recém-publicada não ser tomada por quem chegar antes do dono. O
        token é o valor de `UPWATCH_SETUP_TOKEN` (ou do arquivo em
        `UPWATCH_SETUP_TOKEN_FILE`); sem a variável, o processo gera um a
        cada subida e o escreve só no log, uma vez. A comparação é em
        tempo constante.

        Instalação que já tem conta responde 409 antes de olhar o token&#58;
        ele deixa de valer quando a conta passa a existir.

        Limitado por origem, para o token não ser adivinhado por
        tentativa&#58; o limite vale também para o token certo.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, setup_token]
              properties:
                username: { type: string, maxLength: 64 }
                password: { type: string, minLength: 12, maxLength: 72 }
                setup_token:
                  type: string
                  writeOnly: true
                  description: |
                    Token de configuração; está no log do servidor ou em
                    `UPWATCH_SETUP_TOKEN`.
      responses:
        "201":
          description: Conta criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: |
            Token de configuração ausente ou inválido; o erro aponta o campo
            `setup_token`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: A instalação já possui uma conta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: |
            Tentativas demais da mesma origem. O limite é por endereço da
            conexão; atrás de proxy reverso, todos dividem o do proxy.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Segundos até a próxima tentativa valer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Abre uma sessão
      description: |
        Senha errada e conta inexistente devolvem a mesma resposta, de
        propósito: distingui-las permitiria descobrir quais contas existem.

        Falhas repetidas bloqueiam a conta temporariamente.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Sessão aberta; o cookie acompanha a resposta
          headers:
            Set-Cookie:
              schema: { type: string }
              description: Cookie `upwatch_session`, HttpOnly e SameSite=Lax
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429":
          description: Tentativas demais; aguarde antes de tentar novamente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Encerra a sessão
      responses:
        "204": { description: Sessão encerrada }

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Devolve a conta autenticada
      responses:
        "200":
          description: Conta atual
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/auth/password:
    post:
      tags: [auth]
      summary: Troca a senha
      description: |
        Encerra todas as sessões abertas, inclusive a desta requisição.
        Trocar a senha porque ela pode ter vazado não adianta se quem a
        obteve continuar logado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 12, maxLength: 72 }
      responses:
        "204": { description: Senha trocada e sessões encerradas }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/auth/tokens:
    get:
      tags: [auth]
      summary: Lista os tokens da conta
      responses:
        "200":
          description: Tokens existentes, sem os segredos
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/APIToken" }
    post:
      tags: [auth]
      summary: Cria um token
      description: |
        Esta é a **única** resposta em que o segredo aparece. Guarde-o
        agora; depois só o prefixo fica disponível.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                expires_at:
                  type: string
                  format: date-time
                  description: Sem valor, o token não expira
      responses:
        "201":
          description: Token criado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/APIToken"
                  - type: object
                    properties:
                      token:
                        type: string
                        description: O segredo; não é recuperável depois

  /api/v1/auth/tokens/{id}:
    delete:
      tags: [auth]
      summary: Revoga um token
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "204": { description: Token revogado }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/users:
    get:
      tags: [auth]
      summary: Lista as contas
      description: |
        Só administrador. A lista de contas é material de reconhecimento&#58;
        nomes de usuário válidos são metade do trabalho de quem tenta
        entrar.

        Administrador com escopo vê só as contas cujo escopo ele poderia
        conceder.
      responses:
        "200":
          description: Contas cadastradas
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [auth]
      summary: Cria uma conta
      description: |
        Só administrador. O papel é obrigatório e não tem valor padrão&#58;
        o padrão que menos incomoda é justamente o que concede acesso
        demais.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username: { type: string, maxLength: 64 }
                password: { type: string, minLength: 12, maxLength: 72 }
                role: { type: string, enum: [admin, viewer] }
                scope:
                  $ref: "#/components/schemas/Scope"
                  description: |
                    Ausente é todos os grupos. Quem tem escopo não concede
                    mais do que tem&#58; pedir todos os grupos devolve 403, e
                    citar grupo fora do próprio escopo devolve 400 como
                    grupo inexistente.
      responses:
        "201":
          description: Conta criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/users/{id}:
    put:
      tags: [auth]
      summary: Troca o papel e o escopo de uma conta
      description: |
        Só papel e escopo. Nome de usuário e senha não se editam por aqui&#58;
        trocar a senha de outra pessoa sem ela saber é poder que uma
        ferramenta de monitoramento não precisa ter, e renomear conta
        quebra o rastro de quem fez o quê.

        Rebaixar ou restringir o último administrador com acesso a todos
        os grupos devolve 409 — a instalação ficaria sem ninguém capaz de
        criar grupo de topo, canal ou página pública.

        Conta com escopo maior que o de quem pede responde 404.
      parameters:
        - $ref: "#/components/parameters/PathID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [admin, viewer] }
                scope:
                  $ref: "#/components/schemas/Scope"
                  description: Ausente mantém o escopo atual.
      responses:
        "200":
          description: Papel atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Não é possível rebaixar o último administrador
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [auth]
      summary: Remove uma conta
      description: |
        As sessões saem em cascata, então quem for removido perde o
        acesso na hora e não no vencimento do cookie.

        Remover o último administrador devolve 409.
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "204": { description: Conta removida }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Não é possível remover o último administrador
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/monitors:
    get:
      tags: [monitors]
      summary: Lista monitores
      description: |
        Paginação por keyset; as páginas seguem estáveis sob escrita
        concorrente. Só traz monitores do escopo da conta.
      parameters:
        - name: group_id
          in: query
          schema: { type: integer, format: int64 }
          description: |
            Restringe ao grupo e aos ambientes dele. Grupo fora do escopo
            devolve lista vazia, como um grupo sem nada.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
        - name: after_id
          in: query
          schema: { type: integer, format: int64 }
          description: Use o `next_after_id` da página anterior
        - name: enabled
          in: query
          schema: { type: boolean }
        - name: tag
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Página de monitores
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Monitor" }
                  has_more: { type: boolean }
                  next_after_id: { type: integer, format: int64 }
    post:
      tags: [monitors]
      summary: Cadastra um monitor
      description: |
        Para conta com acesso restrito a grupos, com
        `UPWATCH_RESTRICT_PRIVATE_TARGETS` ligado (o padrão), o destino que
        resolver para loopback, rede privada, enlace local (metadado da
        nuvem) ou espaço compartilhado de provedor é recusado com 400, e o
        nome que não resolve também. Na edição, o destino que não mudou não
        é conferido de novo.

        `parent_id` de fora do escopo responde 404, como o inexistente.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MonitorInput" }
      responses:
        "201":
          description: Monitor criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Monitor" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Já existe monitor com esse nome no mesmo grupo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/monitors/{id}:
    get:
      tags: [monitors]
      summary: Devolve um monitor
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      responses:
        "200":
          description: O monitor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Monitor" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [monitors]
      summary: Sobrescreve um monitor
      description: |
        As mesmas regras de alvo interno e de `parent_id` do cadastro. O
        pai que depende, direta ou indiretamente, do próprio monitor fecha
        um ciclo e é recusado com 400 em `parent_id`.
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MonitorInput" }
      responses:
        "200":
          description: Monitor atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Monitor" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [monitors]
      summary: Remove o monitor e todo o seu histórico
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      responses:
        "204": { description: Monitor removido }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/monitors/{id}/children:
    post:
      tags: [monitors]
      summary: Põe vários monitores sob este (definir pai em lote)
      description: |
        O monitor do caminho vira o pai (`parent_id`) de cada monitor da
        lista. Com o pai em queda confirmada, a falha de um filho é
        gravada como `unknown` — lacuna no histórico, fora da
        disponibilidade — e não avisa; quando o pai volta, o filho que
        continuar fora avisa normalmente. Pai sem medição ou pausado não
        cala ninguém.

        Tudo ou nada: um filho inexistente ou de fora do escopo responde
        404, e um que fecharia ciclo (o próprio pai ou um ancestral dele)
        responde 400, sem gravar nenhum.
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monitor_ids]
              properties:
                monitor_ids:
                  type: array
                  minItems: 1
                  items: { type: integer, format: int64 }
      responses:
        "200":
          description: Os monitores, já com o pai novo
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Monitor" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/summaries:
    get:
      tags: [data]
      summary: Resumo da janela para todos os monitores
      description: |
        Estado, disponibilidade, percentis de latência e a série já
        dividida em buckets - tudo calculado no servidor.

        Existe para que nenhum cliente precise calcular. O painel e a tela
        de detalhe somavam disponibilidade cada um por conta própria, em
        cópias separadas do mesmo cálculo, e discordavam sobre o que fazer
        com ausência de medição. Aqui o número é um só, e um script recebe
        exatamente o que a interface mostra.

        A camada é escolhida pela largura da janela: ate 24 h le batidas
        cruas, ate 30 d le agregado horario, acima disso o diario. Quem
        chama nao precisa saber que existe uma tabela de agregados; o campo
        `source` informa de onde veio.

        Campos numericos vem nulos quando nao houve medicao. Nulo e zero
        sao coisas diferentes - zero afirma "esteve fora o tempo todo" ou
        "respondeu instantaneamente".

        Uma requisicao cobre todos os monitores: uma por monitor degradava
        justamente na instalacao grande, onde a lista importa mais.

        `status` e o estado confirmado do monitor, o mesmo do cartao de
        grupo e de "Problemas agora" - nao o da janela nem o da ultima
        batida. A ultima batida vem em `last_check_status`.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: buckets
          in: query
          description: Quantos pontos a serie deve ter, cobrindo a janela inteira.
          schema: { type: integer, minimum: 1, maximum: 500, default: 60 }
      responses:
        "200":
          description: Um resumo por monitor
          content:
            application/json:
              schema:
                type: object
                properties:
                  from: { type: string, format: date-time }
                  to: { type: string, format: date-time }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Summary" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/monitors/{id}/heartbeats:
    get:
      tags: [data]
      summary: Batidas cruas do período
      description: |
        Batidas cruas têm retenção curta. Para janelas longas use
        `/rollups`, que responde por meses sem custo proporcional.
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
        - name: probe_id
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Batidas em ordem cronológica
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Heartbeat" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/monitors/{id}/rollups:
    get:
      tags: [data]
      summary: Estatísticas agregadas do período
      description: |
        Percentis são exatos: horário e diário são derivados sempre das
        batidas cruas, nunca de percentis parciais.
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: resolution
          in: query
          schema: { type: string, enum: [hourly, daily], default: hourly }
        - name: probe_id
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Agregados em ordem cronológica
          content:
            application/json:
              schema:
                type: object
                properties:
                  resolution: { type: string, enum: [hourly, daily] }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Rollup" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/monitors/{id}/export:
    get:
      tags: [data]
      summary: Exporta as batidas do período
      description: A resposta é enviada em fluxo; períodos longos não são materializados em memória.
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: format
          in: query
          schema: { type: string, enum: [csv, json], default: csv }
      responses:
        "200":
          description: Arquivo com as batidas
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Heartbeat" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/push/{token}:
    get:
      tags: [push]
      summary: Registra o sinal de um monitor push
      description: |
        Mesmo efeito do POST. Existe porque muito agendador e muito
        healthcheck só sabem fazer `curl URL`, e o push é justamente
        para eles.

        Sem parâmetros o sinal significa `up`, como sempre significou.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/PushStatus"
        - $ref: "#/components/parameters/PushMsg"
        - $ref: "#/components/parameters/PushLatency"
      responses:
        "200": { $ref: "#/components/responses/PushAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/PushTooManyRequests" }
    post:
      tags: [push]
      summary: Registra o sinal de um monitor push
      description: |
        O segredo viaja no caminho porque quem reporta é um cron ou um
        worker, que não tem sessão de interface nem deve precisar de uma.

        Token inválido e monitor inexistente devolvem a mesma resposta, e
        o token é conferido antes dos parâmetros. Cada token pertence a um
        monitor só: o cadastro recusa o repetido.

        Status, causa e latência são opcionais e podem vir na query string
        ou num corpo JSON (só com `Content-Type: application/json`; outro
        corpo é ignorado, como sempre foi). Quando o mesmo campo vem nos
        dois, vale a query string. Campos desconhecidos no corpo são
        tolerados.

        Um `down` explícito não abre incidente na hora: cada sinal conta
        como uma observação na confirmação de N falhas, e as verificações
        seguintes, até chegar outro sinal, só repetem o que ele disse sem
        contar de novo. Com N=2 são precisos dois sinais de queda; um
        `down` seguido de silêncio cai pela regra do silêncio. A causa vai
        para o incidente e para o aviso, e nunca para a página pública.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/PushStatus"
        - $ref: "#/components/parameters/PushMsg"
        - $ref: "#/components/parameters/PushLatency"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Até 16 KiB; acima disso, 413.
              properties:
                status: { type: string, enum: [up, down, degraded], default: up }
                msg:
                  type: string
                  description: Causa curta. Cortada em 200 caracteres.
                latency_ms:
                  type: integer
                  minimum: 0
                  maximum: 86400000
                  description: Duração medida pelo próprio serviço, até um dia
      responses:
        "200": { $ref: "#/components/responses/PushAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/PushTooManyRequests" }

  /api/v1/channel-types:
    get:
      tags: [alerts]
      summary: Tipos de canal disponíveis
      description: |
        A interface monta a escolha a partir daqui, em vez de manter uma
        lista própria que sai de sincronia a cada canal novo.
      responses:
        "200":
          description: Tipos atendidos
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { type: string, enum: [webhook, discord, slack, email, ntfy] }

  /api/v1/channels:
    get:
      tags: [alerts]
      summary: Lista os destinos de aviso
      description: |
        A configuração nunca é devolvida: ela contém a URL do webhook, a
        senha do SMTP ou o token do ntfy - credenciais de quem pode
        publicar no canal.

        Para conta com acesso restrito a grupos, só os canais vinculados a
        monitores ou grupos do escopo dela&#58; o nome e o destino de um
        canal que só avisa sobre os outros já dizem quem existe fora.
      responses:
        "200":
          description: Canais cadastrados
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Channel" }
    post:
      tags: [alerts]
      summary: Cadastra um destino de aviso
      description: |
        A configuração é validada montando o notificador de verdade.
        Descobrir que a URL está errada só durante um incidente seria
        descobrir tarde demais.

        Canal é recurso de todos os grupos&#58; criar, alterar, apagar,
        testar e vincular exigem escopo total (403 para os demais).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelInput" }
      responses:
        "201":
          description: Canal criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: Já existe canal com esse nome
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/channels/{id}:
    get:
      tags: [alerts]
      summary: Devolve um canal
      description: |
        Canal que não avisa sobre nada do escopo da conta responde 404.

        Para quem pode editar canais (papel com escrita e acesso a todos
        os grupos), a resposta traz também config, sem credencial, para o
        formulário de edição. Os demais recebem só o Channel.
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      responses:
        "200":
          description: O canal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [alerts]
      summary: Atualiza um canal
      description: |
        Os vínculos com monitores e grupos continuam. A credencial que
        não volta no GET é mantida quando não vem: url ausente mantém a
        URL do webhook, password ausente a senha do SMTP, token ausente o
        token do ntfy, e um cabeçalho com o valor "***" o valor guardado.
        Campo presente, mesmo vazio, é o novo valor.

        A credencial guardada só acompanha o mesmo destino: ao trocar a
        URL, o servidor SMTP ou o servidor do ntfy, ela precisa vir de
        novo, ou a edição responde 400. Trocar o tipo não mantém nada.
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelInput" }
      responses:
        "200":
          description: Canal atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [alerts]
      summary: Remove um canal e seus vínculos
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      responses:
        "204": { description: Canal removido }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/channels/{id}/test:
    post:
      tags: [alerts]
      summary: Entrega um aviso de exemplo
      description: |
        A entrega é síncrona: quem apertou o botão está esperando saber se
        chegou, e enfileirar devolveria sucesso sem essa garantia.

        Sem este endpoint, a única forma de descobrir que o canal funciona
        seria esperar uma queda de verdade.
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      responses:
        "200":
          description: A mensagem foi aceita pelo canal
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: entregue }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502":
          description: O canal recusou a mensagem
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/monitors/{id}/channels:
    get:
      tags: [alerts]
      summary: Canais que avisam sobre este monitor
      description: Traz apenas os habilitados — um canal desligado não recebe nada.
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      responses:
        "200":
          description: Canais vinculados e habilitados
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Channel" }

  /api/v1/monitors/{id}/channels/{channelID}:
    put:
      tags: [alerts]
      summary: Vincula um canal ao monitor
      description: |
        Idempotente — vincular duas vezes não é erro. Exige escopo total&#58;
        o canal é de todos os grupos, e pendurá-lo no próprio monitor é
        mexer no aviso dos outros. Canal inexistente é 404.
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/PathChannelID"
      responses:
        "204": { description: Vínculo criado }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: A conta não alcança todos os grupos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [alerts]
      summary: Desvincula um canal do monitor
      description: Exige escopo total, como vincular. Canal inexistente é 404.
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/PathChannelID"
      responses:
        "204": { description: Vínculo removido }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: A conta não alcança todos os grupos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/monitors/{id}/events:
    get:
      tags: [data]
      summary: Linha do tempo de falhas e mudanças de estado
      description: |
        Mudanças confirmadas de estado (`state`) e batidas com falha
        (`failure`), cada uma com a causa, da mais recente para trás.

        Paginação para trás&#58; passe o `next_cursor` da página anterior em
        `cursor`. O cursor é composto (instante, tipo, chave), então
        eventos do mesmo instante continuam na página seguinte em vez de se
        perderem, e a página nunca passa do `limit`. `has_more` só é
        verdadeiro quando há de fato mais eventos.

        As falhas vêm das batidas cruas e somem com a poda (7 dias por
        padrão); as mudanças de estado ficam.
      parameters:
        - $ref: "#/components/parameters/PathID"
        - name: cursor
          in: query
          schema: { type: string }
          description: O `next_cursor` da página anterior. Opaco.
        - name: before
          in: query
          schema: { type: string, format: date-time }
          description: |
            Começa dos eventos anteriores a este instante (exclusivo).
            Ignorado quando há `cursor`.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: type
          in: query
          schema: { type: string, enum: [state, failure] }
      responses:
        "200":
          description: Página de eventos
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/MonitorEvent" }
                  has_more: { type: boolean }
                  next_cursor:
                    type: string
                    description: Só quando `has_more`; passe em `cursor`.
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/groups:
    get:
      tags: [groups]
      summary: Lista os grupos do escopo
      description: Em ordem de caminho ("RPA / hml" antes de "RPA / prod").
      responses:
        "200":
          description: Grupos
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/MonitorGroup" }
    post:
      tags: [groups]
      summary: Cria um grupo
      description: |
        Dois níveis no máximo (Sistema → Ambiente). Grupo de topo só quem
        alcança todos os grupos cria (403 para os demais); ambiente, quem
        alcança o sistema. Criar ambiente num grupo que já tem monitores
        devolve 409&#58; os monitores ficariam num grupo que não é mais
        folha.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MonitorGroupInput" }
      responses:
        "201":
          description: Grupo criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitorGroup" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Nome ou slug repetido entre irmãos, ou pai com monitores
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/groups/summary:
    get:
      tags: [groups]
      summary: Um cartão por grupo, com o pior estado
      description: |
        Para a tela inicial. O sistema soma os ambientes dele. "Sem grupo"
        (`group_id` nulo) aparece só para quem alcança tudo e só quando
        tem monitor. Monitor pausado conta em `paused` e fica fora do pior
        estado. Grupo sem monitor nenhum sai com `status` "empty".
      responses:
        "200":
          description: Cartões
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/GroupSummary" }

  /api/v1/groups/{id}:
    get:
      tags: [groups]
      summary: Devolve um grupo
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      responses:
        "200":
          description: O grupo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitorGroup" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [groups]
      summary: Renomeia ou move um grupo
      description: |
        Renomear (nome ou slug) exige enxergar todos os irmãos do grupo&#58;
        para um sistema, escopo total. A recusa é 403 seja o nome livre ou
        ocupado, para o conflito com um sistema fora do escopo não revelar
        que ele existe. Dentro de um sistema concedido, renomear um
        ambiente é livre.
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MonitorGroupInput" }
      responses:
        "200":
          description: Grupo atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitorGroup" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Nome ou slug repetido entre irmãos, ou pai com monitores
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [groups]
      summary: Apaga um grupo vazio
      description: |
        Grupo com monitores ou ambientes devolve 409&#58; apagar perderia o
        vínculo deles em silêncio. Vínculos de canal e concessões de escopo
        saem junto.
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      responses:
        "204": { description: Grupo apagado }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: O grupo ainda tem monitores ou ambientes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/groups/{id}/channels:
    get:
      tags: [alerts]
      summary: Canais vinculados ao grupo
      description: |
        Só os habilitados. Valem para todos os monitores do grupo e, num
        sistema, para os dos ambientes dele — inclusive os criados depois.
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      responses:
        "200":
          description: Canais
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Channel" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/groups/{id}/channels/{channelID}:
    put:
      tags: [alerts]
      summary: Vincula um canal ao grupo
      description: |
        Idempotente. Convive com o vínculo por monitor; cada canal avisa uma
        vez só. Exige escopo total, como vincular a monitor.
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/PathChannelID"
      responses:
        "204": { description: Vínculo criado }
        "403":
          description: A conta não alcança todos os grupos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [alerts]
      summary: Desvincula um canal do grupo
      description: Exige escopo total. Canal inexistente é 404.
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/PathChannelID"
      responses:
        "204": { description: Vínculo removido }
        "403":
          description: A conta não alcança todos os grupos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/problems:
    get:
      tags: [groups]
      summary: Problemas agora
      description: |
        Monitores ativos fora do ar, degradados e sem medição, nessa
        ordem; dentro de cada estado, o mais antigo primeiro. Cada linha
        traz o grupo, desde quando e a última causa.
      responses:
        "200":
          description: Problemas
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Problem" }

  /api/v1/incidents:
    get:
      tags: [alerts]
      summary: Histórico de quedas confirmadas
      description: |
        Uma queda só entra aqui depois de confirmada pelo número de falhas
        seguidas configurado no monitor; oscilação passageira não vira
        incidente.

        Do mais recente para o mais antigo. Paginação para trás, como a da
        linha do tempo do monitor&#58; passe o `next_cursor` da página
        anterior em `cursor`. `after_id` e `next_after_id` continuam como
        nomes obsoletos dos mesmos valores, com o sentido corrigido (antes
        devolviam sempre a mesma página). `cursor` e `after_id` juntos e
        diferentes respondem 400.
      parameters:
        - name: monitor_id
          in: query
          schema: { type: integer, format: int64 }
        - name: open
          in: query
          schema: { type: boolean }
          description: Restringe às quedas ainda em curso
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
          description: O `next_cursor` da página anterior. Opaco.
        - name: after_id
          in: query
          deprecated: true
          schema: { type: integer, format: int64 }
          description: |
            Nome obsoleto de `cursor`&#58; traz os incidentes com id menor.
            Use `cursor`.
      responses:
        "200":
          description: Incidentes, do mais recente para o mais antigo
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Incident" }
                  has_more: { type: boolean }
                  next_cursor:
                    type: string
                    description: Só quando `has_more`; passe em `cursor`.
                  next_after_id:
                    type: integer
                    format: int64
                    deprecated: true
                    description: O mesmo valor de `next_cursor`, para quem usa `after_id`.
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/public:
    get:
      tags: [public]
      security: []
      summary: Página pública padrão
      description: |
        Responde a página marcada como padrão, sem slug no caminho.

        Existe porque numa instalação com uma página só o slug repete o
        que o caminho já diz&#58; "/status/estado" é redundante, e
        "/status" é o endereço que se cola em contrato e em rodapé de
        e-mail.

        Devolve 404 quando nenhuma página foi marcada como padrão — a
        instalação não elege uma sozinha.
      responses:
        "200":
          description: Estado da página
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicView" }
        "304": { description: Sem alteração desde a versão do cliente }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/public/feed.atom:
    get:
      tags: [public]
      security: []
      summary: Feed Atom da página padrão
      responses:
        "200":
          description: Documento Atom
          content:
            application/atom+xml:
              schema: { type: string }
        "304": { description: Sem alteração desde a versão do cliente }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/public/{slug}:
    get:
      tags: [public]
      security: []
      summary: Página pública de estado
      description: |
        Sem credencial, de propósito — é o link que se compartilha durante
        uma queda.

        Página inexistente e página desligada devolvem o mesmo 404:
        distinguir as duas confirmaria a existência da página a quem só
        chutou o endereço.

        A resposta traz `Cache-Control` e `ETag`. Revalidar com
        `If-None-Match` devolve 304 — é a única rota do UpWatch desenhada
        para receber tráfego de verdade.
      parameters:
        - $ref: "#/components/parameters/PathSlug"
      responses:
        "200":
          description: Estado da página
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicView" }
        "304": { description: Sem alteração desde a versão do cliente }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/public/{slug}/feed.atom:
    get:
      tags: [public]
      security: []
      summary: Feed Atom dos relatos
      description: |
        Permite acompanhar a página sem cadastrar e-mail, e integrar num
        canal de chat sem que o UpWatch precise saber falar com ele.

        O feed é derivado da mesma visão da página, então não tem como
        mostrar nada que ela não mostre.
      parameters:
        - $ref: "#/components/parameters/PathSlug"
      responses:
        "200":
          description: Documento Atom
          content:
            application/atom+xml:
              schema: { type: string }
        "304": { description: Sem alteração desde a versão do cliente }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/status-pages:
    get:
      tags: [status-pages]
      summary: Lista as páginas públicas
      responses:
        "200":
          description: Páginas cadastradas
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/StatusPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [status-pages]
      summary: Cria uma página pública
      description: |
        O slug vai na URL e é validado com rigor&#58; apenas minúsculas sem
        acento, números e hífen. Ele é colado em chat e digitado de
        memória, e barra ou ponto-ponto virariam travessia de caminho.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatusPageInput" }
      responses:
        "201":
          description: Página criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/status-pages/{id}:
    get:
      tags: [status-pages]
      summary: Página com grupos e componentes
      description: |
        Os três numa resposta só&#58; a tela de administração precisa de
        todos para desenhar qualquer coisa, e três requisições seriam três
        estados de carregamento para montar uma lista.
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: Página, grupos e componentes
          content:
            application/json:
              schema:
                type: object
                properties:
                  page: { $ref: "#/components/schemas/StatusPage" }
                  groups:
                    type: array
                    items: { $ref: "#/components/schemas/StatusPageGroup" }
                  components:
                    type: array
                    items: { $ref: "#/components/schemas/StatusPageComponent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [status-pages]
      summary: Atualiza a página
      parameters:
        - $ref: "#/components/parameters/PathID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatusPageInput" }
      responses:
        "200":
          description: Página atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [status-pages]
      summary: Remove a página
      description: |
        Os monitores permanecem&#58; eles são da operação, e a página é só
        uma das formas de mostrá-los.
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "204": { description: Página removida }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/status-pages/{id}/default:
    put:
      tags: [status-pages]
      summary: Torna a página a padrão
      description: |
        A padrão responde em `/status`, sem slug. Promover rebaixa a
        anterior na mesma transação — exigir dois passos abriria uma
        janela em que `/status` não responde.

        Endpoint próprio, e não um campo na edição&#58; esconder a troca
        dentro de um PUT de título faria `/status` mudar de dono sem
        ninguém pedir.
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: Página promovida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/status-pages/{id}/groups:
    post:
      tags: [status-pages]
      summary: Cria um grupo de componentes
      description: |
        Sem grupo, uma instalação com quarenta alvos publica uma lista de
        quarenta linhas onde ninguém acha o que veio procurar.
      parameters:
        - $ref: "#/components/parameters/PathID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "201":
          description: Grupo criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusPageGroup" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/status-pages/{id}/groups/{groupID}:
    put:
      tags: [status-pages]
      summary: Renomeia ou reordena um grupo
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/PathGroupID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "200":
          description: Grupo atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusPageGroup" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [status-pages]
      summary: Desfaz o agrupamento
      description: |
        Os componentes permanecem publicados, apenas sem grupo&#58; quem
        tira um grupo espera reorganizar a página, não remover o que
        estava dentro.
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/PathGroupID"
      responses:
        "204": { description: Grupo removido }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/status-pages/{id}/components/{monitorID}:
    put:
      tags: [status-pages]
      summary: Publica um monitor na página
      description: |
        PUT e não POST&#58; publicar duas vezes o mesmo alvo atualiza o
        vínculo em vez de criar um segundo.

        O rótulo é o nome público. O monitor pode se chamar
        `api-prod-us-east-1` na operação e aparecer como "API" para quem
        lê, sem obrigar a renomeá-lo nem a entregar a convenção de nomes
        da infraestrutura.
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/PathMonitorID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComponentInput" }
      responses:
        "200":
          description: Componente publicado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusPageComponent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [status-pages]
      summary: Despublica um monitor da página
      description: |
        Só desta página&#58; o mesmo alvo continua publicado nas demais.
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/PathMonitorID"
      responses:
        "204": { description: Componente removido }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/announcements:
    get:
      tags: [status-pages]
      summary: Lista os relatos publicados
      parameters:
        - name: open
          in: query
          schema: { type: boolean }
          description: Restringe aos que ainda não foram resolvidos
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
        - name: after_id
          in: query
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Relatos, do mais recente para o mais antigo
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Announcement" }
                  has_more: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [status-pages]
      summary: Publica um relato
      description: |
        O relato é o que uma pessoa escreve, separado do incidente que a
        sonda detecta. A causa detectada cita host e porta internos e por
        isso nunca é publicada&#58; o que sai é este texto.

        O alcance é obrigatório e explícito — ao menos um componente, ou
        `global`. Deduzir "toda a plataforma" de uma lista vazia faria um
        relato sobre serviço desativado aparecer na página de todo mundo
        no dia em que alguém apagasse o monitor.

        `body`, quando presente, publica a primeira entrada da linha do
        tempo junto&#58; abrir um incidente e não dizer nada é o pior
        momento para exigir duas requisições.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnouncementInput" }
      responses:
        "201":
          description: Relato publicado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Announcement" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/announcements/{id}:
    get:
      tags: [status-pages]
      summary: Relato com a linha do tempo
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: Relato e atualizações
          content:
            application/json:
              schema:
                type: object
                properties:
                  announcement: { $ref: "#/components/schemas/Announcement" }
                  updates:
                    type: array
                    items: { $ref: "#/components/schemas/AnnouncementUpdate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [status-pages]
      summary: Corrige um relato
      description: |
        O início não se reescreve&#58; é quando a queda começou, e mexer
        nele reescreveria o histórico que a página já publicou.
      parameters:
        - $ref: "#/components/parameters/PathID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnouncementInput" }
      responses:
        "200":
          description: Relato atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Announcement" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [status-pages]
      summary: Remove um relato
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "204": { description: Relato removido }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/announcements/{id}/updates:
    post:
      tags: [status-pages]
      summary: Publica uma atualização na linha do tempo
      description: |
        A fase do relato acompanha a da entrada publicada. Mantê-las
        separadas obrigaria a lembrar de mudar o estado depois de
        escrever o texto, e o esquecimento apareceria numa página pública
        dizendo "investigando" sob uma atualização que diz "resolvido".
      parameters:
        - $ref: "#/components/parameters/PathID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnouncementUpdateInput" }
      responses:
        "201":
          description: Atualização publicada
          content:
            application/json:
              schema:
                type: object
                properties:
                  announcement: { $ref: "#/components/schemas/Announcement" }
                  update: { $ref: "#/components/schemas/AnnouncementUpdate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/events:
    get:
      tags: [data]
      summary: Fluxo de eventos ao vivo
      description: |
        Eventos enviados pelo servidor (SSE). O tráfego é de mão única, e
        SSE atravessa proxy reverso e reconecta sozinho sem código extra.

        Tipos emitidos: `monitor.created`, `monitor.updated`,
        `monitor.deleted`.

        Só chegam eventos de monitores do escopo. O escopo resolvido serve
        aos eventos seguintes por até 5 s, então uma concessão retirada
        vale no fluxo aberto em segundos. Monitor que sai do escopo (movido
        para grupo de fora) chega como `monitor.deleted`, sem revelar para
        onde foi.

        A credencial é reconferida a cada 60 s&#58; sessão encerrada, token
        revogado ou conta apagada encerram o fluxo, e a reconexão do
        navegador recebe 401.
      responses:
        "200":
          description: Fluxo aberto
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: upwatch_session
    bearerToken:
      type: http
      scheme: bearer

  parameters:
    PushStatus:
      name: status
      in: query
      description: |
        Estado informado pelo próprio serviço. Ausente vale `up`.
        `unknown` é recusado: é o que o UpWatch diz quando não sabe.
      schema: { type: string, enum: [up, down, degraded], default: up }
    PushMsg:
      name: msg
      in: query
      description: |
        Causa curta, que vai para o incidente e para o aviso. Cortada em
        200 caracteres; caracteres de controle viram espaço. Nunca aparece
        na página pública.
      schema: { type: string, maxLength: 200 }
    PushLatency:
      name: latency_ms
      in: query
      description: Duração medida pelo próprio serviço, em milissegundos inteiros, até um dia.
      schema: { type: integer, minimum: 0, maximum: 86400000 }
    PathID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    PathChannelID:
      name: channelID
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    PathGroupID:
      name: groupID
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    PathMonitorID:
      name: monitorID
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    PathSlug:
      name: slug
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", maxLength: 64 }
      description: Identificador da página na URL
    From:
      name: from
      in: query
      schema: { type: string, format: date-time }
      description: Início do período (RFC 3339). Padrão&#58; 24 horas atrás.
    To:
      name: to
      in: query
      schema: { type: string, format: date-time }
      description: Fim do período (RFC 3339). Padrão&#58; agora.

  responses:
    Forbidden:
      description: |
        A conta está autenticada, mas não tem permissão. Devolvido a um
        observador em qualquer rota de escrita, e a quem tem escopo ao
        alterar canal, página pública ou relato, criar grupo de topo ou
        conceder mais do que tem. Monitor ou grupo fora do escopo nunca dá
        403, e sim 404, para não confirmar que existe.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PushTooManyRequests:
      description: |
        Requisições demais da mesma origem. O limite é por endereço da
        conexão; atrás de proxy reverso, todos dividem o do proxy.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Segundos até a próxima tentativa valer
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PushAccepted:
      description: Sinal registrado
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string, example: ok }
    BadRequest:
      description: Requisição inválida
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Autenticação necessária ou inválida
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Registro não encontrado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - unauthorized
                - not_found
                - conflict
                - too_many_requests
                - internal_error
            message: { type: string }
            field:
              type: string
              description: Campo reprovado, quando o erro for de validação

    User:
      type: object
      description: A senha e seu hash nunca aparecem nesta representação.
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        role:
          type: string
          enum: [admin, viewer]
          description: |
            `admin` administra; `viewer` só lê. A separação é por verbo&#58;
            tudo que altera o estado exige administrador, tudo que só lê
            aceita observador.
        scope: { $ref: "#/components/schemas/Scope" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    APIToken:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        prefix:
          type: string
          description: Fragmento visível do segredo, para identificar o token
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    MonitorInput:
      type: object
      required: [name, type, interval_seconds, timeout_seconds]
      properties:
        name: { type: string }
        type:
          type: string
          enum: [http, tcp, icmp, dns, tls, push, redis, postgres, mysql]
        target:
          type: string
          description: |
            URL, host:porta ou nome, conforme o tipo. Vazio para push.
            Para redis, postgres e mysql é host:porta; a credencial vai
            em config, nunca no endereço.
        interval_seconds:
          type: integer
          minimum: 5
          description: Intervalo entre verificações
        timeout_seconds:
          type: integer
          minimum: 1
          description: Precisa ser menor que o intervalo, senão os checks se acumulam
        confirmation_threshold:
          type: integer
          minimum: 1
          default: 3
          description: Falhas consecutivas antes de declarar indisponibilidade
        degraded_latency_ms:
          type: integer
          minimum: 0
          description: Acima disso o resultado vira degradado. Zero desliga.
        config:
          type: object
          description: |
            Configuração específica do tipo, validada no cadastro pelo
            checker correspondente e gravada na grafia canônica dos campos.
            Para push, ver PushConfig; para http, ver HTTPConfig. Para os
            tipos de protocolo, ver RedisConfig, PostgresConfig e
            MySQLConfig: a senha é aceita na escrita e nunca devolvida;
            numa edição, omiti-la mantém a guardada, desde que o endereço
            não mude e o TLS não fique mais fraco. No tipo http vale o
            mesmo para basic_auth_pass (a leitura traz
            basic_auth_pass_set), e os cabeçalhos de credencial
            (Authorization, Cookie e nomes com auth, token, key, secret,
            password, session ou credential) voltam com o valor "***";
            reenviar "***" mantém o valor guardado.
          additionalProperties: true
        parent_id:
          type: integer
          format: int64
          description: |
            Monitor do qual este depende, como a sonda de quem a
            verificação depende. Com o pai em queda confirmada, a falha
            deste vira lacuna e não avisa. Omitir desliga o pai.
        group_id:
          type: integer
          format: int64
          nullable: true
          description: |
            Grupo folha do monitor; nulo é "Sem grupo", que só quem
            alcança todos os grupos usa. O PUT sobrescreve&#58; omitir move
            para "Sem grupo".
        enabled: { type: boolean, default: true }
        tags:
          type: array
          items: { type: string }

    HTTPConfig:
      type: object
      description: Campo `config` de um monitor do tipo `http`.
      properties:
        method:
          type: string
          enum: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS]
          default: GET
        headers:
          type: object
          additionalProperties: { type: string }
          description: |
            Cabeçalhos de credencial (Authorization, Cookie e nomes com auth,
            token, key, secret, password, session ou credential) voltam com
            o valor "***"; reenviar "***" mantém o valor guardado.
        body: { type: string }
        expect_status:
          type: array
          items: { type: integer, minimum: 100, maximum: 599 }
          description: Códigos aceitos. Vazio aceita qualquer 2xx.
        body_contains: { type: string }
        body_not_contains: { type: string }
        body_regex:
          type: string
          description: Expressão regular (sintaxe RE2), validada no cadastro
        json_assertions:
          type: array
          items: { $ref: "#/components/schemas/JSONAssertion" }
          description: |
            Condições sobre o corpo interpretado como JSON. Todas precisam
            valer. Corpo que não é JSON, ou maior que o limite de leitura de
            1 MiB, derruba o monitor com a causa explicada.
        follow_redirects: { type: boolean, default: true }
        skip_tls_verify: { type: boolean, default: false }
        basic_auth_user: { type: string }
        basic_auth_pass:
          type: string
          writeOnly: true
          description: |
            Nunca devolvida; a leitura traz basic_auth_pass_set. Omiti-la
            na edição mantém a guardada, desde que o endereço não mude e a
            verificação do certificado continue ligada.
        basic_auth_pass_set:
          type: boolean
          readOnly: true
          description: Existe senha de basic auth guardada.

    JSONAssertion:
      type: object
      required: [path, op]
      description: |
        Uma condição sobre um valor do corpo JSON. Asserção inválida é
        recusada no cadastro com 400.
      properties:
        path:
          type: string
          maxLength: 512
          description: |
            Subconjunto de JSONPath: `$`, `$.chave`, `$.lista[0].chave` e
            `$["chave com espaço"]`. Sem filtros, wildcards nem fatias —
            cada caminho aponta para no máximo um valor.
          example: $.queue_lag
        op:
          type: string
          enum: [eq, ne, lt, lte, gt, gte, contains, exists, absent]
          description: |
            `eq` e `ne` comparam valor e tipo (`"100"` não é igual a `100`;
            números comparam pelo valor, `340` é igual a `340.0`).
            `lt`, `lte`, `gt` e `gte` só entre números. `contains` procura
            um trecho num texto ou um elemento numa lista. `exists` passa
            se o caminho existir, mesmo com valor null; `absent` passa se
            ele não existir. Caminho ausente é diferente de qualquer valor:
            `ne` passa e `eq` com null reprova.
        value:
          description: |
            Qualquer valor JSON. Obrigatório para todos os operadores menos
            `exists` e `absent`, que o recusam; número para `lt`, `lte`,
            `gt` e `gte`. Números no valor precisam caber exatos num
            float64 (sobreviver a ida e volta pela menor grafia), ter até
            100 caracteres e expoente entre -10000 e 10000.
      example:
        path: $.queue_lag
        op: lt
        value: 100

    Monitor:
      allOf:
        - $ref: "#/components/schemas/MonitorInput"
        - type: object
          properties:
            id: { type: integer, format: int64 }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            next_expected_push:
              type: string
              format: date-time
              description: |
                Próxima execução prevista de um push com agenda. Vem no
                detalhe, na criação e na edição, nunca na listagem; ausente
                sem agenda.

    PushConfig:
      type: object
      description: |
        Configuração de um monitor push. Sem `schedule`, o sinal é esperado
        a cada `interval_seconds` mais a folga. Com `schedule`, o monitor só
        cai quando falta o sinal de uma execução prevista até a folga
        terminar. Um monitor que nunca recebeu sinal fica desconhecido
        durante a primeira janela depois da criação (com agenda, até a
        primeira execução prevista mais a folga) e cai depois dela.
      required: [token]
      properties:
        token:
          type: string
          minLength: 16
          description: |
            Credencial do endpoint, única entre os monitores. Só o
            administrador a recebe de volta; para o observador e no fluxo de
            eventos ela sai como `***`.
        grace_period_seconds:
          type: integer
          minimum: 0
          description: |
            Folga além do intervalo ou da execução prevista. Zero usa o
            próprio intervalo; com `schedule`, no mínimo 5 minutos, porque o
            intervalo ali é só o ritmo da verificação e nada diz quanto a
            rotina leva.
        schedule:
          type: string
          example: "2 9,18 * * *"
          description: Expressão cron de 5 campos (minuto hora dia mês dia-da-semana).
        timezone:
          type: string
          example: America/Sao_Paulo
          description: Fuso IANA da agenda. Obrigatório com `schedule`.

    RedisConfig:
      type: object
      description: |
        Configuração do monitor redis. Envia PING e avalia as asserções.
        Recomenda-se um usuário de ACL só com os comandos usados
        (+ping +info e os das asserções).
      properties:
        username: { type: string, description: Usuário de ACL (Redis 6+) }
        password:
          type: string
          writeOnly: true
          description: Nunca devolvida; a leitura traz password_set.
        password_set:
          type: boolean
          readOnly: true
          description: Existe senha guardada.
        db: { type: integer, minimum: 0 }
        tls: { type: boolean }
        skip_tls_verify: { type: boolean }
        max_used_memory_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Acusa queda quando used_memory passa disto. Zero desliga.
        assertions:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/RedisAssertion" }

    RedisAssertion:
      type: object
      description: |
        Condição numérica sobre um comando de leitura. Só a lista fechada
        de comandos é aceita; o monitor não executa comando arbitrário.
        Exemplo: SCARD rq:workers:default gte 1.
      required: [command, op, value]
      properties:
        command:
          type: string
          enum: [SCARD, LLEN, GET, EXISTS, HGET, ZCARD, DBSIZE, INFO]
        key: { type: string, description: Obrigatória exceto em DBSIZE e INFO }
        field: { type: string, description: Campo do HGET ou do INFO }
        section: { type: string, description: Seção do INFO (memory, clients...) }
        op: { type: string, enum: [eq, ne, lt, lte, gt, gte] }
        value: { type: number }

    PostgresConfig:
      type: object
      description: |
        Configuração do monitor postgres. Abre sessão e executa a consulta
        numa transação somente leitura; a latência é a duração da consulta.
        Recomenda-se um usuário somente leitura e sem acesso a dados.
      required: [username]
      properties:
        username: { type: string }
        password:
          type: string
          writeOnly: true
          description: Nunca devolvida; a leitura traz password_set.
        password_set: { type: boolean, readOnly: true }
        database: { type: string }
        sslmode:
          type: string
          enum: [disable, allow, prefer, require, verify-ca, verify-full]
          default: prefer
        query: { type: string, maxLength: 4096, default: SELECT 1 }

    MySQLConfig:
      type: object
      description: |
        Configuração do monitor mysql (MySQL ou MariaDB). Mesmo
        comportamento do postgres.
      required: [username]
      properties:
        username: { type: string }
        password:
          type: string
          writeOnly: true
          description: Nunca devolvida; a leitura traz password_set.
        password_set: { type: boolean, readOnly: true }
        database: { type: string }
        tls:
          type: string
          enum: ["false", "true", skip-verify, preferred]
          default: "false"
        query: { type: string, maxLength: 4096, default: SELECT 1 }

    Scope:
      type: object
      description: |
        Sobre quais grupos o papel vale. Conceder um sistema concede os
        ambientes dele, inclusive os criados depois.
      properties:
        all_groups:
          type: boolean
          description: Verdadeiro alcança tudo, inclusive monitores sem grupo.
        group_ids:
          type: array
          items: { type: integer, format: int64 }
          description: Grupos concedidos quando `all_groups` é falso. Pelo menos um.

    MonitorGroupInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 60 }
        slug:
          type: string
          description: Vazio é derivado do nome. Único entre irmãos.
        parent_id:
          type: integer
          format: int64
          description: Sistema do ambiente; ausente é grupo de topo.

    MonitorGroup:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string }
        parent_id: { type: integer, format: int64, nullable: true }
        path:
          type: string
          description: Nome completo, como "RPA / prod".
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    GroupSummary:
      type: object
      properties:
        group_id:
          type: integer
          format: int64
          nullable: true
          description: Nulo é "Sem grupo".
        parent_id: { type: integer, format: int64, nullable: true }
        name: { type: string }
        path: { type: string }
        status:
          type: string
          enum: [up, degraded, down, unknown, empty]
          description: |
            Pior estado entre os ativos, na ordem down, degraded, unknown,
            up. "empty" é o grupo sem monitor nenhum&#58; não há o que medir,
            o que é diferente de "unknown" (monitor que deveria responder e
            não está sendo medido).
        total: { type: integer }
        up: { type: integer }
        degraded: { type: integer }
        down: { type: integer }
        unknown: { type: integer }
        paused: { type: integer }
        affected:
          type: integer
          description: |
            Monitores calados por um pai em queda. Não contam como
            problema nem como no ar; para o estado do cartão, valem como
            unknown.
        problems:
          type: integer
          description: down + degraded + unknown (sem os calados pelo pai)

    Problem:
      type: object
      properties:
        monitor_id: { type: integer, format: int64 }
        name: { type: string }
        type: { type: string }
        group_id: { type: integer, format: int64, nullable: true }
        group_path:
          type: string
          description: Vazio é "Sem grupo".
        status: { type: string, enum: [down, degraded, unknown] }
        since:
          type: string
          format: date-time
          description: Desde quando o estado vale; para monitor nunca medido, o cadastro.
        cause:
          type: string
          description: Mensagem da última verificação com falha, ou a causa da queda em curso.
        last_check_at: { type: string, format: date-time, nullable: true }
        dependents:
          type: integer
          description: |
            Monitores calados por esta queda, entre os que a conta enxerga.
            Eles não aparecem na lista: o problema é este.

    MonitorEvent:
      type: object
      properties:
        type: { type: string, enum: [state, failure] }
        at: { type: string, format: date-time }
        status:
          type: string
          enum: [up, degraded, down, unknown]
          description: Estado novo (state) ou resultado da batida (failure).
        from:
          type: string
          description: Estado anterior; só em `state`.
        message: { type: string }
        latency_ms: { type: integer, description: Só em `failure`. }
        probe_id: { type: string, description: Só em `failure`. }


    Channel:
      type: object
      description: |
        A configuração nunca aparece nesta representação: ela contém a URL
        do webhook, a senha do SMTP ou o token do ntfy - credenciais de
        quem pode publicar no canal.
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        type: { type: string, enum: [webhook, discord, slack, email, ntfy] }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ChannelDetail:
      allOf:
        - $ref: "#/components/schemas/Channel"
        - type: object
          properties:
            config:
              type: object
              description: |
                Só para quem pode editar canais. A configuração sem
                credencial - url_set, password_set e token_set dizem se
                há URL, senha ou token guardados, e os cabeçalhos vêm com
                o nome e o valor "***".

    ChannelInput:
      type: object
      required: [name, type, config]
      properties:
        name: { type: string, maxLength: 80 }
        type: { type: string, enum: [webhook, discord, slack, email, ntfy] }
        enabled: { type: boolean, default: true }
        config:
          description: |
            A forma depende de type. webhook, discord e slack usam
            WebhookChannelConfig; email usa EmailChannelConfig; ntfy usa
            NtfyChannelConfig.

            Senha, token e URL de webhook são credenciais e nunca voltam
            nas leituras.
          oneOf:
            - $ref: "#/components/schemas/WebhookChannelConfig"
            - $ref: "#/components/schemas/EmailChannelConfig"
            - $ref: "#/components/schemas/NtfyChannelConfig"

    WebhookChannelConfig:
      type: object
      description: Canais webhook, discord e slack.
      required: [url]
      properties:
        url:
          type: string
          description: Destino da entrega
        headers:
          type: object
          additionalProperties: { type: string }
          description: Cabeçalhos extras, para destinos que exigem token próprio
        template:
          type: string
          description: |
            Modelo próprio da mensagem, compilado no cadastro para o
            erro aparecer aqui e não durante o incidente.

            Campos disponíveis - Monitor (com ID, Name, Target, Type e
            Tags), Group, Status, Message, Duration, At e Text. A configuração
            do monitor nunca está ao alcance do modelo - ela guarda
            senhas e tokens -, e um modelo que tenta ler campo
            inexistente, como .Monitor.Config, é recusado no cadastro.
        body_template:
          description: |
            Forma do corpo inteiro, e não só da frase. Só no canal
            webhook - discord e slack têm corpo ditado pelo destino e
            recusam este campo no cadastro.

            Qualquer objeto ou lista JSON. Em qualquer texto dentro
            dele, os marcadores são substituídos - $monitor,
            $monitor_id, $target, $status, $previous_status, $message,
            $at, $duration_seconds, $group e $text. Também vale ${nome}, e $$
            escreve um cifrão literal.

            Sozinho, o marcador entrega o valor com o tipo dele, de
            modo que $duration_seconds chega como número. Dentro de um
            texto, compõe a frase.

            Sem este campo, o corpo é o envelope padrão com todos os
            campos - quem já integrou contra ele não muda.
          oneOf:
            - type: object
            - type: array
          example:
            event: $status
            service: $monitor
            outage_seconds: $duration_seconds

    EmailChannelConfig:
      type: object
      description: |
        Canal email, por SMTP. O assunto é sempre
        "[UpWatch] <monitor>: <estado>" - fora do ar, no ar, degradado ou
        sem medição - para agrupar no cliente de e-mail e casar com regra
        de caixa de entrada; nome de monitor acima de 100 caracteres é
        cortado com reticências. O corpo vai em texto e HTML, com causa,
        horário e, na volta, quanto tempo durou a queda. Um destinatário
        recusado pelo servidor não impede a entrega aos outros.

        Endereço com espaço, < ou > na parte local é recusado, mesmo
        entre aspas.
      required: [host, from, to]
      properties:
        host: { type: string, example: smtp.exemplo.com }
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: Vazia segue o modo - 587 em starttls, 465 em tls, 25 em none.
        security:
          type: string
          enum: [starttls, tls, none]
          default: starttls
          description: |
            starttls exige que o servidor ofereça STARTTLS - sem ele, a
            entrega falha em vez de seguir em claro. tls é o TLS implícito
            da porta 465. none só é aceito sem usuário e senha, para relé
            local.
        username: { type: string }
        password:
          type: string
          writeOnly: true
          description: Segredo. Nunca volta nas leituras.
        from: { type: string, example: "UpWatch <alertas@exemplo.com>" }
        to:
          type: array
          minItems: 1
          items: { type: string, example: plantao@exemplo.com }

    NtfyChannelConfig:
      type: object
      description: |
        Canal ntfy, para alerta push no celular sem conta. A queda chega
        com prioridade 5 e a volta e o degradado com 3; o título é
        "<monitor>: <estado>". A mensagem é cortada em 4096 bytes, o
        limite acima do qual o ntfy a entrega como anexo.
      required: [topic]
      properties:
        server:
          type: string
          default: https://ntfy.sh
          description: |
            Servidor público ou próprio, http ou https. Só o endereço -
            query, fragmento e usuário e senha na URL são recusados.
        topic:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,64}$"
          description: |
            No servidor público (ntfy.sh), com ao menos 12 caracteres:
            lá o tópico é a única credencial, e quem souber o nome lê os
            alertas.
        token:
          type: string
          writeOnly: true
          description: |
            Token de acesso, para servidor com controle de acesso. Vai
            como Authorization Bearer, por isso exige https - salvo em
            servidor no loopback (localhost, 127.0.0.1, ::1). Caractere de
            controle é recusado. Segredo - nunca volta nas leituras.

    Incident:
      type: object
      properties:
        id: { type: integer, format: int64 }
        monitor_id: { type: integer, format: int64 }
        started_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }
        duration_seconds:
          type: integer
          description: |
            Já calculado. É a primeira pergunta sobre qualquer incidente, e
            obrigar o cliente a subtrair dois horários faria cada
            integração repetir a mesma conta.
        cause:
          type: string
          description: A falha observada quando a queda foi confirmada
        open: { type: boolean }

    Summary:
      type: object
      description: |
        Resumo de uma janela. Os numericos sao anulaveis de proposito:
        nulo significa que nao houve medicao, e zero e uma afirmacao.
      properties:
        monitor_id: { type: integer, format: int64 }
        status:
          type: string
          enum: [up, down, degraded, unknown]
          description: |
            Estado confirmado do monitor, o mesmo do cartao de grupo e de
            "Problemas agora".
        last_check_status:
          type: string
          enum: [up, down, degraded, unknown]
          nullable: true
          description: |
            Resultado da ultima batida, sem confirmacao. Nulo quando nunca
            houve batida.
        source:
          type: string
          enum: [raw, hourly, daily]
          description: Camada de onde o resumo saiu.
        uptime_percent:
          type: number
          nullable: true
          description: |
            Percentual disponivel. Nulo quando nada foi observado sobre o
            alvo - o que e diferente de zero. Amostras "unknown" ficam fora
            do denominador: contar falha do observador como falha do
            observado seria mentir sobre o alvo.
        latency_p50_ms: { type: number, nullable: true }
        latency_p95_ms: { type: number, nullable: true }
        latency_p99_ms: { type: number, nullable: true }
        last_check_at: { type: string, format: date-time, nullable: true }
        up: { type: integer }
        degraded: { type: integer }
        down: { type: integer }
        unknown: { type: integer }
        affected_by:
          type: object
          description: |
            Ancestral em queda que cala o monitor; ausente quando nada
            cala. As falhas do monitor viram lacuna e não avisam enquanto
            isso durar. Id nulo e nome ausente quando a conta não enxerga
            o ancestral.
          properties:
            id: { type: integer, format: int64, nullable: true }
            name: { type: string }
        series:
          type: array
          description: |
            A janela dividida em buckets de largura igual, cobrindo o
            periodo inteiro. Bucket sem amostra vem "unknown" com latencia
            nula, para que um buraco nao seja desenhado como queda.
          items:
            type: object
            properties:
              at: { type: string, format: date-time }
              status: { type: string, enum: [up, down, degraded, unknown] }
              latency_ms: { type: number, nullable: true }

    Heartbeat:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        status:
          type: string
          enum: [up, down, degraded, unknown]
          description: |
            `unknown` significa que o check rodou sem observar nada — a
            rede do próprio monitor caiu, ou um monitor push ainda não
            recebeu sinal. Fica fora do cálculo de disponibilidade.
        latency_ms:
          type: integer
          description: Zero quando não houve resposta
        probe_id: { type: string }
        message: { type: string }

    Rollup:
      type: object
      properties:
        bucket_start: { type: string, format: date-time }
        resolution: { type: string, enum: [hourly, daily] }
        total:
          type: integer
          description: Checks executados, inclusive os sem observação
        up: { type: integer }
        down: { type: integer }
        degraded: { type: integer }
        unknown: { type: integer }
        uptime_percent:
          type: number
          description: |
            Calculado apenas sobre as amostras observadas. Degradado conta
            como disponível; `unknown` fica fora do denominador.
        latency_avg_ms: { type: number }
        latency_min_ms: { type: number }
        latency_max_ms: { type: number }
        latency_p50_ms: { type: number }
        latency_p95_ms: { type: number }
        latency_p99_ms: { type: number }

    StatusPage:
      type: object
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string }
        title: { type: string }
        description: { type: string }
        show_latency:
          type: boolean
          description: |
            Desligado por padrão&#58; latência é informação competitiva
            para parte de quem publica, e "está no ar?" não depende dela.
        time_zone:
          type: string
          description: Fuso em que a página exibe horários. Vazio é UTC.
        enabled:
          type: boolean
          description: |
            Desligada, a rota pública devolve 404 — não 403, que
            confirmaria a existência da página.
        default:
          type: boolean
          description: Responde em `/status`, sem slug. No máximo uma.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    StatusPageInput:
      type: object
      required: [slug, title]
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          maxLength: 64
        title: { type: string, maxLength: 120 }
        description: { type: string }
        show_latency: { type: boolean, default: false }
        time_zone: { type: string, example: America/Sao_Paulo }
        enabled: { type: boolean, default: true }

    StatusPageGroup:
      type: object
      properties:
        id: { type: integer, format: int64 }
        page_id: { type: integer, format: int64 }
        name: { type: string }
        position:
          type: integer
          description: Ordem editorial — o que o cliente mais usa vem primeiro

    GroupInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 120 }
        position: { type: integer, default: 0 }

    StatusPageComponent:
      type: object
      properties:
        page_id: { type: integer, format: int64 }
        monitor_id: { type: integer, format: int64 }
        group_id:
          type: integer
          format: int64
          nullable: true
          description: Nulo lista o componente antes dos grupos
        label:
          type: string
          description: Nome público; vazio usa o nome do monitor
        position: { type: integer }

    ComponentInput:
      type: object
      properties:
        group_id: { type: integer, format: int64, nullable: true }
        label: { type: string, maxLength: 120 }
        position: { type: integer, default: 0 }

    Announcement:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        impact: { type: string, enum: [none, minor, major, critical] }
        phase:
          type: string
          enum: [investigating, identified, monitoring, resolved]
        global:
          type: boolean
          description: Aparece em todas as páginas
        components:
          type: array
          items: { type: integer, format: int64 }
        incident_id: { type: integer, format: int64, nullable: true }
        started_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AnnouncementInput:
      type: object
      required: [title, impact, phase]
      properties:
        title: { type: string, maxLength: 160 }
        impact: { type: string, enum: [none, minor, major, critical] }
        phase:
          type: string
          enum: [investigating, identified, monitoring, resolved]
        global: { type: boolean, default: false }
        components:
          type: array
          items: { type: integer, format: int64 }
        incident_id: { type: integer, format: int64, nullable: true }
        body:
          type: string
          maxLength: 4000
          description: Primeira entrada da linha do tempo, opcional

    AnnouncementUpdate:
      type: object
      properties:
        id: { type: integer, format: int64 }
        announcement_id: { type: integer, format: int64 }
        phase:
          type: string
          enum: [investigating, identified, monitoring, resolved]
        body: { type: string }
        published_at: { type: string, format: date-time }

    AnnouncementUpdateInput:
      type: object
      required: [phase, body]
      properties:
        phase:
          type: string
          enum: [investigating, identified, monitoring, resolved]
        body: { type: string, maxLength: 4000 }

    PublicView:
      type: object
      description: |
        A página como sai para quem não tem credencial. Note o que não
        existe aqui&#58; endereço de alvo, causa detectada, identificador
        de monitor e contagem de alvos da instalação.
      properties:
        slug: { type: string }
        title: { type: string }
        description: { type: string }
        time_zone: { type: string }
        status:
          type: string
          enum: [up, down, degraded, unknown]
          description: Pior estado entre os componentes
        impact:
          type: string
          enum: [none, minor, major, critical]
          description: Maior impacto entre os relatos abertos
        window_days: { type: integer, example: 90 }
        generated_at: { type: string, format: date-time }
        groups:
          type: array
          items: { $ref: "#/components/schemas/PublicGroup" }
        announcements:
          type: array
          items: { $ref: "#/components/schemas/PublicAnnouncement" }

    PublicGroup:
      type: object
      properties:
        name:
          type: string
          description: Vazio é o grupo implícito dos componentes sem agrupamento
        monitors:
          type: array
          items: { $ref: "#/components/schemas/PublicMonitor" }

    PublicMonitor:
      type: object
      properties:
        name: { type: string }
        status: { type: string, enum: [up, down, degraded, unknown] }
        uptime_percent:
          type: number
          nullable: true
          description: |
            Ausente quando nada foi observado na janela. Zero afirmaria
            queda total, que é a leitura mais alarmante possível.
        latency_p95_ms:
          type: integer
          format: int64
          nullable: true
          description: Só aparece se a página liberar latência
        history:
          type: array
          items: { $ref: "#/components/schemas/PublicDay" }

    PublicDay:
      type: object
      properties:
        date:
          type: string
          format: date
          description: |
            Dia de calendário, não instante&#58; um carimbo faria cada
            navegador reinterpretá-lo no próprio fuso e a mesma barra
            mudaria de lugar dependendo de quem olha.
        status: { type: string, enum: [up, down, degraded, unknown] }
        uptime_percent: { type: number, nullable: true }

    PublicAnnouncement:
      type: object
      properties:
        title: { type: string }
        impact: { type: string, enum: [none, minor, major, critical] }
        phase:
          type: string
          enum: [investigating, identified, monitoring, resolved]
        components:
          type: array
          items: { type: string }
          description: Rótulos públicos, nunca identificadores
        started_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
        updates:
          type: array
          items: { $ref: "#/components/schemas/PublicAnnouncementUpdate" }

    PublicAnnouncementUpdate:
      type: object
      properties:
        phase:
          type: string
          enum: [investigating, identified, monitoring, resolved]
        body: { type: string }
        published_at: { type: string, format: date-time }

security:
  - sessionCookie: []
  - bearerToken: []
